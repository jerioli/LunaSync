<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#ffffff"/>
  
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Luna crescent icon -->
  <g transform="translate(450, 220)">
    <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" opacity="0.2"/>
    <path d="M 20 50 A 30 30 0 1 1 80 50 A 20 20 0 1 0 20 50" fill="url(#logoGradient)"/>
  </g>
  
  <!-- Medical cross -->
  <g transform="translate(520, 250)">
    <rect x="18" y="8" width="8" height="24" fill="url(#logoGradient)"/>
    <rect x="10" y="16" width="24" height="8" fill="url(#logoGradient)"/>
  </g>
  
  <!-- Sync arrows -->
  <g transform="translate(580, 250)">
    <path d="M 5 10 L 15 5 L 15 8 L 25 8 L 25 12 L 15 12 L 15 15 Z" fill="url(#logoGradient)"/>
    <path d="M 25 20 L 15 25 L 15 22 L 5 22 L 5 18 L 15 18 L 15 15 Z" fill="url(#logoGradient)"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#1e293b">
    LUNASync
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#64748b">
    Medical Clinic Management System
  </text>
  
  <!-- Features -->
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#64748b">
    Patient Management • Appointment Scheduling • Medical Records • OCR Processing
  </text>
  
  <!-- URL -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#22c55e">
    lunasync.site
  </text>
</svg>